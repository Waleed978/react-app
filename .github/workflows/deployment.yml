name: Deployment
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: check lints
        run: npm run lint
      - name: build
        run: npm run build
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist/
          # path: |
          #   dist/
          #   package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-files
          path: dist/
      - name: Deploy
        run: echo "deploying"
      - name: Deploy





    